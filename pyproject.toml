[project]
name = "e2e-job-analytics"
version = "0.1.0"
description = "Pipeline dữ liệu việc làm: crawl → Bronze → Silver → Gold → Power BI"
readme = "README.md"
authors = [
    { name = "Minh Huy", email = "huybm.ds@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.126",
    "lxml>=6.1.3",
    "pyspark==3.5.9",
    "seleniumbase>=4.57.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
