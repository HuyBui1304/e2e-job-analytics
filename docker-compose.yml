name: e2e-job
services:
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16
    command: ["postgres", "-c", "password_encryption=md5"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
      HIVE_DB_PASSWORD: ${HIVE_DB_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  metastore:
    image: apache/hive:3.1.3
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    env_file: .env
    environment:
      TZ: Asia/Ho_Chi_Minh
      HADOOP_CLASSPATH: /opt/hadoop/share/hadoop/tools/lib/*
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore_db
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=${HIVE_DB_PASSWORD}
    entrypoint:
      - /bin/bash
      - -c
      - |
        export HADOOP_CLIENT_OPTS="-Xmx1G $$SERVICE_OPTS"
        /opt/hive/bin/schematool -dbType postgres -info || /opt/hive/bin/schematool -dbType postgres -initSchema
        exec /opt/hive/bin/hive --skiphadoopversion --skiphbasecp --service metastore
    ports:
      - "127.0.0.1:9083:9083"
    volumes:
      - ./docker/hive/core-site.xml:/opt/hive/conf/core-site.xml:ro
    restart: unless-stopped

  trino:
    image: trinodb/trino:484
    depends_on:
      metastore:
        condition: service_started
      minio:
        condition: service_started
    env_file: .env
    environment:
      TZ: Asia/Ho_Chi_Minh
    mem_limit: 3g
    ports:
      - "127.0.0.1:8089:8080"
    volumes:
      - ./docker/trino/catalog:/etc/trino/catalog:ro
    restart: unless-stopped

  postgres-serving:
    image: postgres:16
    environment:
      POSTGRES_USER: ${SERVING_DB_USER}
      POSTGRES_PASSWORD: ${SERVING_DB_PASSWORD}
      POSTGRES_DB: ${SERVING_DB_NAME}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pg_serving_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  spark-job:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: e2e-job/spark:latest
    profiles: ["jobs"]
    env_file: .env
    environment:
      TZ: Asia/Ho_Chi_Minh
      MINIO_ENDPOINT: http://minio:9000
      HIVE_METASTORE_URI: thrift://metastore:9083
      SERVING_DB_URL: jdbc:postgresql://postgres-serving:5432/serving_db

  crawler:
    build:
      context: .
      dockerfile: docker/crawler/Dockerfile
    image: e2e-job/crawler:latest
    platform: linux/amd64
    profiles: ["jobs"]
    env_file: .env
    environment:
      TZ: Asia/Ho_Chi_Minh
      MINIO_ENDPOINT: http://minio:9000
    shm_size: 2gb
    volumes:
      - ./data:/app/data

volumes:
  minio_data:
  pg_data:
  pg_serving_data:
networks:
  default:
    name: e2e_net
